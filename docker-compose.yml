services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vouchtails
    ports:
      - "5433:5432"
    volumes:
      - vouchtails_pgdata:/var/lib/postgresql/data

volumes:
  vouchtails_pgdata:
